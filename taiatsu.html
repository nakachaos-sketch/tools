<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>絶縁耐力試験成績表</title>
<meta name="apple-mobile-web-app-title" content="耐圧試験">
<meta name="application-name" content="耐圧試験">
<link rel="apple-touch-icon" href="icons/taiatsu-180.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icons/taiatsu-512.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 過電流継電器アプリと同じ見た目:紺のバー、白い入力面、良=緑/否=赤 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2430; --sub:#5b6878; --line:#cfd6de;
  --accent:#16496b; --accent-ink:#ffffff;
  --ok:#17803d; --ok-soft:#e3f4e8; --ng:#c62828; --ng-soft:#fde8e8; --meas:#1a3fbf;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.bar h1{font-size:16px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--accent-ink);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.wrap{max-width:1400px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.wrap.narrow{max-width:860px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card h2{font-size:13px;margin:0;color:var(--accent);letter-spacing:.05em}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:760px){.two-col{grid-template-columns:minmax(0,1fr)}}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:420px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
label{display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--sub);min-width:0}
input[type=text],input[type=date],select{width:100%;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:4px;padding:5px 7px;background:#fff;font-size:15px;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:2.3em;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.btn.small{padding:4px 9px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--accent)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12px;color:var(--sub)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-ng{background:var(--ng-soft);color:var(--ng)} .b-none{background:#edf0f3;color:var(--sub)}
.grp{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px}
.note{font-size:11px;color:var(--sub);line-height:1.4}
.empty{text-align:center;color:var(--sub);padding:20px 8px}
/* 測定値 */
.test{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px dashed var(--line);padding-top:6px}
.test:first-of-type{border-top:none}
.test .nm{font-size:13px;font-weight:700}
.test .nm small{display:block;font-weight:400;color:var(--sub);font-size:11px}
.f{display:flex;flex-direction:column;gap:1px;min-width:0}
.f input{font-size:16px;padding:4px 7px;color:var(--meas);font-variant-numeric:tabular-nums}
.f .rg{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.f.ok input{border-color:var(--ok);background:var(--ok-soft)} .f.ng input{border-color:var(--ng);background:var(--ng-soft)}
.f.ok .rg{color:var(--ok)} .f.ng .rg{color:var(--ng);font-weight:700}
.jd{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);white-space:nowrap}
.jd select{width:auto}
.seq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr) 70px;gap:6px;align-items:end}
@media (max-width:560px){.seq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2430;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
.ngv{color:#c62828!important;font-weight:700}
.pv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.sw input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.npg{display:inline-flex;align-self:flex-start;width:auto}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:6px;overflow:hidden}
.seg button{border:none;background:#fff;color:var(--accent);padding:7px 14px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pages{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.pg{display:contents}
/* 印刷シート。細い罫線を出すため2倍で作って半分に縮小 */
.sheet{width:297mm;height:209mm;background:#fff;color:#000;padding:9mm 11mm;font-family:var(--font);box-shadow:0 1px 4px rgba(0,0,0,.15);flex:none;overflow:hidden}
.sheet-x{width:550mm;height:382mm;transform:scale(.5);transform-origin:0 0}
.sheet-in{border:4px solid #000;height:100%;padding:12mm 14mm 10mm;display:flex;flex-direction:column;gap:6mm}
.sheet.p{width:210mm;height:296mm;padding:9mm 10mm}
.sheet.p .sheet-x{width:380mm;height:556mm}
.sheet.p .sheet-in{padding:10mm 10mm 8mm}
.s-title{text-align:center;font-size:34pt;letter-spacing:.55em;font-weight:500;margin:4mm 0 2mm}
.sheet.p .s-title{font-size:30pt;letter-spacing:.35em}
.s-top{display:flex;justify-content:space-between;align-items:flex-end;gap:8mm}
.s-panel{border:2px solid #000;background:#d9f2d9;min-width:70mm;padding:2.4mm 10mm;text-align:center;font-size:20pt;letter-spacing:.2em}
.s-range{font-size:20pt;margin-left:8mm;flex:1}
.s-date{font-size:19pt;white-space:nowrap}
.sheet.p .s-date{font-size:16pt}
table.s{width:100%;border-collapse:collapse;table-layout:fixed;font-size:18pt;border:3px solid #000}
table.s th,table.s td{border:1px solid #222;text-align:center;vertical-align:middle;padding:0 1mm;height:12.4mm;line-height:1.2;overflow:hidden;white-space:nowrap}
table.s th{background:#d4d4d4;font-weight:400}
table.s td.v{color:#1a3fbf;font-size:19pt}
table.s td.l{text-align:left;padding-left:3mm}
table.s tr.hb th{border-bottom:2px solid #000}
table.s .jg{font-size:20pt;color:#1a3fbf}
.s-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:8mm}
.s-fl{display:flex;flex-direction:column;gap:3mm;align-items:flex-start}
table.x{border-collapse:collapse;font-size:17pt;border:3px solid #000}
table.x th{background:#d4d4d4;font-weight:400;border:1px solid #222;padding:2mm 5mm;white-space:nowrap}
table.x td{border:1px solid #222;width:54mm;height:11mm;text-align:center;color:#1a3fbf;padding:0 3mm}
table.x td.wide{width:90mm}
.s-cap{font-size:16pt;text-align:right}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff}
  .noprint{display:none!important}
  .wrap{padding:0;max-width:none;gap:0}
  .pages{zoom:1!important;gap:0}
  .sheet{box-shadow:none}
  .pg:not(:last-child) .sheet{break-after:page;page-break-after:always}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.inr{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:4px}
table.s.it td{height:13mm;font-size:18pt}
table.s.it td.r1{border-bottom:1px dotted #888}
table.s.it td.r2{border-top:none}
table.s.it td.nm{white-space:normal}
.sheet.p table.s.it td{font-size:15pt;height:12mm}

.sheet-in>table.x{align-self:flex-start}

table.s.mt td{height:12.6mm}
table.s.mt tr.c1 td{border-top:2.5px solid #000}
table.s.mt tr.cn td.rn{border-top:none}
table.s.mt tr td.rn{border-bottom:none;text-align:left;padding-left:5mm;font-size:17pt}
table.s.mt th{font-size:16pt}
table.s .jg{text-align:center}
.cabs{display:flex;flex-direction:column;gap:4mm;margin-top:2mm}
table.s.ct td{height:12mm;font-size:17pt}
table.s.ct td.cl{background:#ccffff;font-size:18pt}
.s-note{font-size:16pt}
.sheet.p table.s.mt th{font-size:13pt}
.sheet.p table.s.mt td{font-size:14pt;height:12mm}
.sheet.p table.s.mt td.rn{font-size:13.5pt;padding-left:3mm}
.sheet.p table.s.ct td{font-size:14pt;height:11mm}
.sheet.p table.s.ct th{font-size:13pt}
.sheet.p .cabs{gap:3mm}

.kj-top{margin-bottom:6px}
.kj{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;padding:8px 10px;border-radius:8px;margin-bottom:6px;border:1.5px solid}
.kj-ok{background:#e6f5ea;border-color:#7cc08f}.kj-ok b{color:#1d7a3a}
.kj-warn{background:#fff6e0;border-color:#e2b850}.kj-warn b{color:#9a6a00}
.kj-ng{background:#fde8e8;border-color:#e08a8a}.kj-ng b{color:#c62828}
.dgw{margin-top:5mm;border:1px solid #000;padding:3mm 4mm}
.dgt{font-size:20pt;letter-spacing:.3em;margin-bottom:2mm}
svg.dg{display:block;margin:0 auto;height:135mm;max-width:100%}
.sheet.p svg.dg{height:auto;width:100%}

</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" hidden>
<script>
/* ===== 絶縁耐力試験 ===== */
const MUSASHI=[
  {name:'保護継電器試験器',model:'IP-R3',r1:'3 kVA',r2:'0〜175 V',maker:'ムサシ電機計器製作所',year:'1990'},
  {name:'耐電圧試験用トランス',model:'R-1230',r1:'3 kVA',r2:'12000 V',maker:'ムサシ電機計器製作所',year:'1990'},
  {name:'耐電圧試験用リアクトル',model:'DR-1230M',r1:'240 mA',r2:'12000 V',maker:'ムサシ電機計器製作所',year:'1990'},
  {name:'高圧用検電器',model:'HSS-6',r1:'7000 V',r2:'音響発光式',maker:'長谷川電機',year:'1990'},
  {name:'絶縁抵抗計',model:'IR4052',r1:'1000 V',r2:'2000 MΩ',maker:'日置電機',year:'2013'}];
const SOKO=[
  {name:'多機能試験器',model:'BCT-25K',r1:'2.5 kVA',r2:'0〜175 V',maker:'双興電機',year:'2015'},
  {name:'耐電圧試験用トランス',model:'T-13K15',r1:'150 mA',r2:'12000 V',maker:'双興電機',year:'1998'},
  {name:'耐電圧試験用リアクトル',model:'L-13K',r1:'209 mA',r2:'12000 V',maker:'双興電機',year:'2006'},
  {name:'高圧用検電器',model:'HSS-6',r1:'7000 V',r2:'音響発光式',maker:'長谷川電機',year:'2013'},
  {name:'絶縁抵抗計',model:'IR4052',r1:'1000 V',r2:'2000 MΩ',maker:'日置電機',year:'2013'}];
function emptyRows(){return [{t:'1',ex:'',lk:''},{t:'5',ex:'',lk:''},{t:'9',ex:'',lk:''}]}
const APP={
  key:'taiatsu.v1',homeTitle:'絶縁耐力試験 成績表',itemName:'試験回路',backupName:'絶縁耐力試験',
  perPage:{L:3,P:5},printDefaults:{cable:true},printSwitches:[['cable','ケーブル欄']],
  instDefault:MUSASHI,instSets:[{name:'ムサシ一式',list:MUSASHI},{name:'双興一式',list:SOKO}],
  newItem(prev){const r={id:uid(),l1:'',l2:'',l3:'三線一括',testV:'10350',time:'10',rows:emptyRows(),irB:'',irA:'',jd:'auto',
      cable:{label:'',type:'',len:'',maker:'',year:''},equips:[],newPage:false};
    if(prev){r.testV=prev.testV;r.time=prev.time;r.rows=prev.rows.map(x=>({t:x.t,ex:'',lk:''}))}return r},
  reset(r){r.rows=r.rows.map(x=>({t:x.t,ex:'',lk:''}));r.irB='';r.irA='';r.jd='auto';return r},
  sample(){const mk=(l,ex,lk,cab)=>{const r=APP.newItem();Object.assign(r,{l1:l[0],l2:l[1],l3:l[2],irB:'2000',irA:'2000',cable:cab});r.rows.forEach(x=>{x.ex=ex;x.lk=lk});return r};
    return {id:uid(),name:'サンプル(2026年2月 竣工試験)',date:'2026-02-11',weather:'晴',temp:'5',hum:'30',tester:'',witness:'',insts:JSON.parse(JSON.stringify(MUSASHI)),
      items:[mk(['引込高圧負荷開閉器 〜','受電盤 DS一次側','三線一括'],'3.8','39',{label:'引込用 高圧ケーブル',type:'耐火6KV FPT 150sq',len:'15',maker:'住電HSTケーブル',year:'2025'}),
        mk(['高圧分岐盤VCB二次側 〜','第1変電設備 DS一次側','三線一括'],'3.0','30',{label:'第1変電用 高圧ケーブル',type:'耐火6KV FPT 100sq',len:'13',maker:'住電HSTケーブル',year:'2025'})]}},
  itemTitle(r){return [r.l1,r.l2].filter(Boolean).join(' ')||'試験回路'},
  itemSub(r){return `${r.testV||'—'}V ・ ${r.time||'—'}分`+(r.cable&&r.cable.type?' ・ '+r.cable.type:'')},
  judge(r){if(r.jd&&r.jd!=='auto')return r.jd;const k=irChk(r);if(k.b===false||k.a===false)return '否';if(lkChk(r).over)return '要確認';const any=r.rows.some(x=>x.lk!==''||x.ex!=='');return any&&r.irA!==''?'良':''},
  editorHTML(r){
    const t=(k,l,ph,dec)=>`<label>${l}<input type="text" ${dec?'inputmode="decimal"':''} data-f="${k}" value="${esc(k.split('.').reduce((o,x)=>o?o[x]:'',r)||'')}" ${ph?`placeholder="${esc(ph)}"`:''}></label>`;
    return `<div class="two-col">
      <div class="card"><h2>回路名及び試験範囲(用紙では3行)</h2>
        ${t('l1','1行目','例) 引込高圧負荷開閉器 〜')}${t('l2','2行目','例) 受電盤 DS一次側')}${t('l3','3行目','例) 三線一括')}
        <div>${NPG(r)}</div></div>
      <div class="card"><h2>試験条件・絶縁抵抗</h2>
        <div class="g3">${t('testV','試験電圧(V)','',1)}${t('time','印加時間(分)','',1)}<label>判定${sel('data-fr="jd"',r.jd||'auto',['auto','良','否'],['自動','良','否'])}</label></div>
        <div class="btns"><button class="btn small" data-act="v66">6.6kV系 → 10350V</button><button class="btn small" data-act="v33">3.3kV系 → 5175V</button></div>
        <div class="g3"><div class="f" id="f-irB">${t('irB','絶縁抵抗 耐圧前(MΩ)','',1)}</div><div class="f" id="f-irA">${t('irA','絶縁抵抗 耐圧後(MΩ)','',1)}</div>${t('irMin','判定値(MΩ以上)',irMinAuto(r)+' (自動)',1)}</div>
        <div class="note" id="jnote"></div></div>
    </div>
    <div class="two-col">
      <div class="card"><h2>経過時間ごとの測定値</h2>
        ${r.rows.map((x,i)=>`<div class="g3">${t(`rows.${i}.t`,'経過時間(分)','',1)}${t(`rows.${i}.ex`,'励磁電流(A)','',1)}<div class="f" id="f-lk-${i}">${t(`rows.${i}.lk`,'漏洩電流(mA)','',1)}</div></div>`).join('')}
        <div class="note">試験電圧は最大使用電圧の1.5倍(6.6kV系:6900V×1.5=10350V)。</div></div>
      <div class="card"><h2>ケーブル(用紙の下に表で出ます)</h2>
        ${t('cable.label','名称','例) 引込用 高圧ケーブル')}
        <div class="g2"><label>種類${sel('data-fr="cable.kind"',(r.cable||{}).kind||'',['',...CAB_KINDS,'その他'],['選択',...CAB_KINDS,'その他(手入力)'])}</label><label>太さ(sq)${sel('data-fr="cable.sq"',(r.cable||{}).sq||'',['',...Object.keys(CAP_OLD)],['選択',...Object.keys(CAP_OLD).map(x=>x+' sq')])}</label></div>
        ${(r.cable||{}).kind==='その他'?t('cable.other','種類(手入力)','例) 6kV EM-CET'):''}<div class="g3">${t('cable.len','亘長(m)','',1)}${t('cable.maker','製造者名')}${t('cable.year','製造年','',1)}</div>
        ${!(r.cable||{}).kind&&!(r.cable||{}).sq&&(r.cable||{}).type?`<div class="note">前に入力した種類: ${esc(r.cable.type)}(種類と太さを選ぶと置き換わります)</div>`:''}
        <div class="g3">${t('cable.cap','静電容量(μF/km・1相)',capAuto(r)?capAuto(r)+' (自動)':'太さから自動',1)}<label>周波数(Hz)${sel('data-fr="freq"',r.freq||'50',['50','60'])}</label><div class="rg" id="calcI" style="align-self:end"></div></div>
        <div class="note">漏洩電流の目安=三線一括の充電電流(I=2πfCV、旧JIS C 3606-1971 の静電容量)。測定値が計算値(ケーブル+機器)より10%以上多いとき、または1回目の値より10%以上増えたときは赤字・「要確認」になります。ケーブルがない回路は空欄のままにしてください。</div></div>
    </div>
    <div class="card"><h2>機器(変圧器・コンデンサなど)</h2>
      ${(r.equips||[]).map((q,i)=>`<div class="g4 eqrow"><label>種類${sel(`data-fr="equips.${i}.type"`,q.type,['tr3','tr1','cap','other'],['三相変圧器','単相変圧器','高圧コンデンサ','その他(mA直接)'])}</label>
        ${q.type==='other'?t(`equips.${i}.name`,'名称','例) 計器用変圧器')+t(`equips.${i}.ma`,'充電電流(mA)','',1):`<label>容量(${q.type==='cap'?'kvar':'kVA'})${sel(`data-fr="equips.${i}.cap"`,q.cap,Object.keys(EQ[q.type].t))}</label>${t(`equips.${i}.qty`,'台数','1',1)}`}
        <div class="btns" style="align-items:end"><button class="btn small danger" data-act="delEq" data-i="${i}">削除</button></div></div>`).join('')||'<div class="empty">機器がありません(ケーブルだけの回路はこのままで)。</div>'}
      <div class="btns"><button class="btn small" data-act="addEq">+ 機器を追加</button></div>

// 絶縁抵抗の判定値:指定がなければ「使用電圧(kV)+1 MΩ」(試験電圧から使用電圧を推定)
function irMinAuto(r){const v=num(r.testV);const kv=isFinite(v)?(v>=9000?6.6:v>=4000?3.3:Math.round(v/1.5/100)/10):6.6;return Math.round((kv+1)*10)/10}
function irChk(r){const m=num(r.irMin),min=isFinite(m)?m:irMinAuto(r);const c=x=>{const v=num(x);return isFinite(v)?v>=min:null};return {min,b:c(r.irB),a:c(r.irA)}}

// 旧JIS C 3606-1971 の静電容量(μF/km・1相) ※耐圧試験計算ツールと同じ
const CAP_OLD={14:0.16,22:0.19,38:0.22,60:0.26,100:0.32,150:0.38,200:0.39,250:0.41,325:0.45};
const CAB_KINDS=['6kV CVT','6kV CV-3C','6kV CV(単心)','耐火 6kV FP-CVT'];
function cabCompose(r){const c=r.cable;if(!c||!(c.kind||c.sq))return;const k=c.kind==='その他'?(c.other||''):(c.kind||'');const t=[k,c.sq?c.sq+'sq':''].filter(Boolean).join(' ');if(c.type!==t){c.type=t;save()}}
function capAuto(r){const c=r.cable||{};if(CAP_OLD[+c.sq])return CAP_OLD[+c.sq];const m=String(c.type||'').normalize('NFKC').match(/(\d+)\s*(sq|mm|ｓｑ)/i);return m&&CAP_OLD[+m[1]]?CAP_OLD[+m[1]]:null}
// 機器の充電電流(mA, 10350V のとき) ※耐圧試験計算ツール(index.html)と同じ値
const EQ={tr1:{n:'単相変圧器',u:'kVA',t:{10:3.3,20:3.8,30:10.8,50:12.2,75:16.5,100:13.2,150:14.6,200:14.1,300:16.5,500:16.4}},
  tr3:{n:'三相変圧器',u:'kVA',t:{10:11.3,20:12.7,30:16.9,50:17.4,75:17.9,100:19.7,150:19.7,200:19.7,300:13.6,500:17.9}},
  cap:{n:'高圧コンデンサ',u:'kvar',t:{10:2.4,15:3.5,20:4.8,25:5.9,30:7.1,50:11.8,75:17.8,100:23.7,150:35.6,200:47.8}}};
function eqMA(q,v){if(q.type==='other'){const m=num(q.ma);return isFinite(m)?m:0}const e=EQ[q.type];if(!e)return 0;const b=e.t[q.cap]||0,n=isFinite(num(q.qty))?num(q.qty):1;return b*n*(isFinite(v)?v:10350)/10350}
function eqText(q){if(q.type==='other')return (q.name||'その他')+(q.ma?` ${q.ma}mA`:'');const e=EQ[q.type]||{n:'',u:''};const n=isFinite(num(q.qty))?num(q.qty):1;return `${e.n} ${q.cap}${e.u}${n!==1?' ×'+n:''}`}
function lkChk(r){const c=r.cable||{},cap=isFinite(num(c.cap))?num(c.cap):capAuto(r),len=num(c.len),v=num(r.testV),f=num(r.freq||'50');
  const cab=cap&&isFinite(len)&&isFinite(v)?2*Math.PI*f*(cap*1e-6*len/1000*3)*v*1000:NaN;
  const eq=(r.equips||[]).reduce((a,q)=>a+eqMA(q,v),0);
  const calc=isFinite(cab)?cab+eq:(eq>0?eq:NaN),lim=calc*1.1,y0=num((r.rows[0]||{}).lk);
  const ok=r.rows.map((x,i)=>{const y=num(x.lk);if(!isFinite(y))return null;
    const a=isFinite(lim)?y<lim+1e-9:null,b=i>0&&isFinite(y0)&&y0>0?y<y0*1.1-1e-9:null;
    if(a===false||b===false)return false;return a===null&&b===null?null:true});
  return {calc,cab,eq,lim,ok,over:ok.includes(false)}}

// 耐圧試験計算ツール(index.html)の「手持ちの試験器」を読む(同じサイトなので共有できる)
const KIT_DEF={tr:[{name:'ムサシ IP-R3＋R-1230',ma:250},{name:'双興 BCT-25K＋T-13K15',ma:150}],rx:[{name:'ムサシ DR-1230M',H:130,ma:0},{name:'双興 L-13K（209mA級）',H:158,ma:0}]};

function kitHTML(r,L){const ic=L.calc;if(!isFinite(ic)||ic<=0)return '<div class="empty">ケーブルか機器を入れると判定します。</div>';
  const v=num(r.testV),f=num(r.freq||'50'),K=kitGet();
  const rx=(K.rx||[]).map(x=>({name:x.name,c:x.H>0?v/(2*Math.PI*f*x.H)*1000:(+x.ma||0)})).filter(x=>x.c>0);
  const kva=v*ic/1e6;
  return `<div class="kj-top">合計 <b>${ic.toFixed(0)} mA</b>(必要容量 約${kva.toFixed(2)} kVA・試験電圧 ${isFinite(v)?v:'—'} V)</div>`+(K.tr||[]).map(t=>{const tm=+t.ma||0;let cls,txt;
    if(ic<=tm){cls='ok';txt='試験器のみでOK'}
    else{let best=null;rx.forEach(x=>{for(let n=1;n<=4;n++){if(ic-n*x.c<=tm){const same=String(x.name).split(/\s/)[0]===String(t.name).split(/\s/)[0];if(!best||n<best.n||(n===best.n&&same&&!best.same))best={n,x,same,net:Math.max(0,ic-n*x.c)};break}}});
      if(best){cls='warn';txt=`リアクトル ${esc(best.x.name)} ${best.n}台でOK(負担 ${best.net.toFixed(0)} mA)`}
      else{cls='ng';txt=`許容オーバー(約${(ic-tm).toFixed(0)} mA 超過)。分割印加か直流を検討`}}
    return `<div class="kj kj-${cls}"><span>${esc(t.name)}(許容 ${tm} mA)</span><b>${txt}</b></div>`}).join('')}

'use strict';
/* ===== 共通部分(件名の保存・一覧・印刷・バックアップ) ===== */
let state=load(),view={name:'home'},pendingConfirm=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(APP.key)||'null')}catch(e){}
  if(!s)s={v:1,projects:[APP.sample()]};
  s.projects=(s.projects||[]).filter(projOK);s.print={sign:true,inst:true,...APP.printDefaults,...(s.print||{})};return s;
}
function save(){try{localStorage.setItem(APP.key,JSON.stringify(state))}catch(e){toast('保存できませんでした')}}
function num(v){if(v==null)return NaN;let s=String(v).replace(/[０-９．－＋]/g,c=>c==='．'?'.':c==='－'?'-':c==='＋'?'+':String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9.+\-eE]/g,'').trim();if(s==='')return NaN;const n=Number(s);return isFinite(n)?n:NaN}
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(m){const t=document.createElement('div');t.className='toast noprint';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function proj(){return state.projects.find(p=>p.id===view.pid)}
function item(){const p=proj();return p&&p.items.find(r=>r.id===view.rid)}
function go(v){view=v;pendingConfirm=null;render();window.scrollTo(0,0)}
function fmtDate(d){const m=(d||'').match(/(\d+)-(\d+)-(\d+)/);return m?`${+m[1]}年 ${+m[2]}月 ${+m[3]}日`:''}
function barHTML(t,back){return `<div class="bar noprint">${back?`<button data-act="${back}">← 戻る</button>`:''}<h1>${esc(t)}</h1></div>`}
function sel(attr,cur,opts,labels){return `<select ${attr}>${opts.map((o,i)=>`<option value="${esc(o)}" ${o===(cur||'')?'selected':''}>${labels?labels[i]:(o?esc(o):'—')}</option>`).join('')}</select>`}
function badge(j){return j==='良'?'<span class="badge b-ok">良</span>':j==='否'?'<span class="badge b-ng">否</span>':(j==='要注意'||j==='要確認')?`<span class="badge b-ng">${j}</span>`:'<span class="badge b-none">未</span>'}
const ngv=(t,bad)=>bad?`<span class="ngv">${t}</span>`:t;
function chunkN(rs,n){const out=[];let cur=[];rs.forEach(r=>{if(r.newPage&&cur.length){out.push(cur);cur=[]}cur.push(r);if(cur.length===n){out.push(cur);cur=[]}});if(cur.length)out.push(cur);return out}
const ORK='tools.printOrient';
function getOrient(){try{const v=localStorage.getItem(ORK);if(v)return v==='P'?'P':'L'}catch(e){}return window.__orient||'L'}
function setOrient(o){try{localStorage.setItem(ORK,o)}catch(e){}window.__orient=o}
function setPortrait(on){document.documentElement.classList.toggle('pp',on);let st=document.getElementById('ppst');
  if(on&&!st){st=document.createElement('style');st.id='ppst';st.textContent='@page{size:A4 portrait;margin:0}';document.head.appendChild(st)}
  if(!on&&st)st.remove()}
function render(){
  const v=view.name,app=$('#app');
  app.innerHTML=v==='home'?homeHTML():v==='project'?projectHTML():v==='item'?itemHTML():previewHTML();
  if(v==='item')APP.updInd(item());
  if(v==='preview'){setPortrait(getOrient()==='P');fit()}
}

  const sw=(k,l)=>`<label class="sw"><input type="checkbox" data-pr="${k}" ${state.print[k]?'checked':''}><span>${l}</span></label>`;
  return `${barHTML(mode==='blank'?'白紙の記入用紙':mode==='form'?'記入用紙':'成績表',mode==='blank'?'toHome':'toProject')}
  <div class="wrap" style="max-width:none">
    <div class="pv-bar noprint">
      <span class="seg" role="group" aria-label="用紙の向き"><button data-act="orientL" class="${!PO?'on':''}">A4横</button><button data-act="orientP" class="${PO?'on':''}">A4縦</button></span>
      <button class="btn main" data-act="doPrint">印刷する</button>
      ${mode!=='blank'?`<button class="btn" data-act="${mode==='full'?'pvForm':'pvFull'}">${mode==='full'?'記入用紙に切替':'測定値入りに切替'}</button>`:''}
      ${APP.instInline?'':sw('inst','測定計器(別紙)')}${sw('sign','試験実施者・監督職員欄')}${APP.printSwitches.map(x=>sw(x[0],x[1])).join('')}
      <span class="note">${pages.length}枚。印刷画面で「A4」「${PO?'縦':'横'}」を選んでください。</span></div>
    <div class="pages" id="pages">${pages.map(x=>`<div class="pg">${x}</div>`).join('')}</div></div>`;
}
function fit(){const el=$('#pages');if(!el)return;el.style.zoom=Math.min(1,(el.parentElement.clientWidth-2)/((getOrient()==='P'?210:297)*96/25.4))}
function dateLine(p,mode){return p&&mode==='full'?`${fmtDate(p.date)||'　　　年　　月　　日'} ・ 天候 ${esc(p.weather||'　')} ・ 温度 ${esc(p.temp||'　')}℃ ・ 湿度 ${esc(p.hum||'　')}％`:'　　　年　　月　　日 ・ 天候　　 ・ 温度　　℃ ・ 湿度　　％'}
function footHTML(p,mode,note){
  const v=k=>p&&mode==='full'?esc(p[k]||''):'';
  const inst='';
  const sign=state.print.sign?`<table class="x"><tr><th>試験実施者</th><td>${v('tester')}</td><th>監督職員(立会者)</th><td>${v('witness')}</td></tr></table>`:'';
  return `<div class="s-foot"><div class="s-fl">${inst}${sign}</div>${note?`<div class="s-cap">${note}</div>`:''}</div>`;
}
function instSheet(p,mode,PO){
  const L=p&&p.insts&&p.insts.length?p.insts:(mode==='blank'?Array(5).fill({name:'',model:'',r1:'',r2:'',maker:'',year:''}):[]);
  const rows=(L.length?L:Array(5).fill({})).map(x=>`<tr><td rowspan="2" class="nm">${esc(x.name||'')}</td><td rowspan="2">${esc(x.model||'')}</td><td class="r1">${esc(x.r1||'')}</td><td rowspan="2">${esc(x.maker||'')}</td><td rowspan="2">${esc(x.year||'')}</td></tr><tr><td class="r2">${esc(x.r2||'')}</td></tr>`).join('');
  return `<div class="sheet${PO?' p':''}"><div class="sheet-x"><div class="sheet-in">
    <div class="s-title">測 定 計 器</div>
    <div class="s-top"><div class="s-range">${p&&mode!=='blank'?esc(p.name||''):''}</div><div class="s-date">${APP.homeTitle.replace(/ 成績表$/,'')}</div></div>
    <table class="s it"><colgroup><col style="width:24%"><col style="width:16%"><col style="width:18%"><col style="width:26%"><col></colgroup>
      <tr class="hb"><th>測定計器名</th><th>型　式</th><th>定　格</th><th>製造者名</th><th>製 造 年</th></tr>${rows}</table>
    ${APP.instExtra?APP.instExtra(p,mode):''}
  </div></div></div>`;
}

/* ===== イベント ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,p=proj(),r=item();
  switch(a){
    case 'toHome':go({name:'home'});break;
    case 'toProject':go({name:'project',pid:view.pid});break;
    case 'newProject':{const np={id:uid(),name:'新しい件名',date:new Date().toISOString().slice(0,10),weather:'',temp:'',hum:'',items:[]};
      const last=state.projects[state.projects.length-1];if(last){['tester','witness'].forEach(k=>np[k]=last[k]||'');np.insts=JSON.parse(JSON.stringify(last.insts||[]))}else np.insts=JSON.parse(JSON.stringify(APP.instDefault))
      state.projects.push(np);save();go({name:'project',pid:np.id});setTimeout(()=>{const i=$('#pName');if(i){i.focus();i.select()}},50);break}
    case 'openProject':go({name:'project',pid:b.dataset.id});break;
    case 'openItem':go({name:'item',pid:view.pid,rid:b.dataset.id});break;
    case 'addItem':{const last=p.items[p.items.length-1];const nr=APP.newItem(last);p.items.push(nr);save();go({name:'item',pid:p.id,rid:nr.id});break}
    case 'dupItem':{const nr=APP.reset(JSON.parse(JSON.stringify(r)));nr.id=uid();nr.newPage=false;p.items.splice(p.items.indexOf(r)+1,0,nr);save();go({name:'item',pid:p.id,rid:nr.id});toast('追加しました');break}
    case 'delItem':if(pendingConfirm!=='delItem'){pendingConfirm='delItem';render();break}
      p.items=p.items.filter(x=>x.id!==r.id);save();go({name:'project',pid:p.id});toast('削除しました');break;
    case 'delProject':if(pendingConfirm!=='delProject'){pendingConfirm='delProject';render();break}
      state.projects=state.projects.filter(x=>x.id!==p.id);save();go({name:'home'});toast('削除しました');break;
    case 'dupProject':{const np=JSON.parse(JSON.stringify(p));np.id=uid();np.name=p.name+'(次回)';np.date='';np.weather='';np.temp='';np.hum='';
      np.items=np.items.map(x=>{const y=APP.reset(x);y.id=uid();return y});state.projects.push(np);save();go({name:'project',pid:np.id});toast('複製しました');break}
    case 'pvFull':go({name:'preview',pid:view.pid,mode:'full'});break;
    case 'pvForm':go({name:'preview',pid:view.pid,mode:'form'});break;
    case 'blank':go({name:'preview',mode:'blank'});break;
    case 'orientL':case 'orientP':setOrient(a==='orientP'?'P':'L');render();break;
    case 'doPrint':{setPortrait(getOrient()==='P');const el=$('#pages'),z=el.style.zoom;el.style.zoom=1;window.print();el.style.zoom=z;break}
    case 'exportJson':{const bl=new Blob([JSON.stringify(Object.assign({app:APPID},state),null,1)],{type:'application/json'}),a2=document.createElement('a'),d=new Date();
      a2.href=URL.createObjectURL(bl);a2.download=`${APP.backupName}_バックアップ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
      saveFile(bl,a2);break}
    case 'importJson':$('#importFile').click();break;
    case 'addInst':p.insts=p.insts||[];p.insts.push({name:'',model:'',r1:'',r2:'',maker:'',year:''});save();render();break;
    case 'delInst':p.insts.splice(+b.dataset.i,1);save();render();break;
    case 'setInst':p.insts=JSON.parse(JSON.stringify(APP.instSets[+b.dataset.i].list));save();render();toast('入れ替えました');break;
    default:if(APP.onAct)APP.onAct(a,b,r);
  }
});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(String(rd.result).replace(/^\uFEFF/,""));if(!Array.isArray(d.projects))throw 0;if(d.app&&d.app!==APPID){toast('これは「'+(APPNAMES[d.app]||d.app)+'」のバックアップです');e.target.value='';return}const sk=d.projects.filter(x=>!projOK(x)).length;d.projects=d.projects.filter(projOK);if(!d.projects.length){toast('このアプリのデータが入っていません');e.target.value='';return}let n=0;
    d.projects.forEach(p=>{const i=state.projects.findIndex(x=>x.id===p.id);if(i>=0)state.projects[i]=p;else state.projects.push(p);n++});
    save();render();toast(`${n}件の件名を読み込みました`+(sk?`(別のアプリのデータ${sk}件は読み込みませんでした)`:''))}catch(err){toast('バックアップファイルではないようです')}e.target.value=''};rd.readAsText(f)});
function setPath(o,path,v){const ks=path.split('.');let x=o;for(let i=0;i<ks.length-1;i++){x=x[ks[i]]=x[ks[i]]||{}}x[ks[ks.length-1]]=v}
document.addEventListener('input',e=>{
  const t=e.target,p=proj(),r=item();
  if(t.id==='q'){view.q=t.value;if(!e.isComposing)$('#plist').innerHTML=listHTML();return}
  if(t.dataset.p&&p){p[t.dataset.p]=t.value;save();if(t.dataset.p==='name')$('.bar h1').textContent=t.value;return}
  if(t.dataset.pi&&p){const [i,k]=t.dataset.pi.split('.');p.insts[+i][k]=t.value;save();return}
  if(t.dataset.f&&r){setPath(r,t.dataset.f,t.value);save();APP.updInd(r);return}
});
document.addEventListener('compositionend',e=>{if(e.target.id==='q'){view.q=e.target.value;$('#plist').innerHTML=listHTML()}});
document.addEventListener('change',e=>{
  const t=e.target,r=item();
  if(t.dataset.rc&&r){r[t.dataset.rc]=t.checked;save();return}
  if(t.dataset.fr&&r){setPath(r,t.dataset.fr,t.value);save();render();return}
  if(t.dataset.fr2&&r){setPath(r,t.dataset.fr2,t.value);save();render();return}
  if(t.dataset.pr){state.print[t.dataset.pr]=t.checked;save();render();return}
});
window.addEventListener('resize',()=>{if(view.name==='preview')fit()});
window.addEventListener('beforeprint',()=>{const el=$('#pages');if(el)el.style.zoom=1});
window.addEventListener('afterprint',()=>{if(view.name==='preview')fit()});
render();

/* バックアップ保存:パソコンは保存先を選ぶ画面、iPhone・iPadは共有メニュー(Box・ファイルに保存など) */
function saveFile(blob,a){const name=a.download;
  const dl=()=>{document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
  const err=e=>{if(e&&e.name==='AbortError')return;dl()};
  try{
    if(window.showSaveFilePicker){showSaveFilePicker({suggestedName:name,types:[{description:'バックアップ(JSON)',accept:{'application/json':['.json']}}]})
      .then(h=>h.createWritable()).then(w=>w.write(blob).then(()=>w.close())).then(()=>URL.revokeObjectURL(a.href)).catch(err);return}
    const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).then(()=>URL.revokeObjectURL(a.href)).catch(err);return}
  }catch(e){}
  dl()}

/* アプリ識別・別アプリのデータ混入対策 */
const APPID=({'taiatsu.v1':'taiatsu','cableDiag.v1':'cable'})[APP.key];const APPNAMES={ocr:'過電流継電器',uvr:'不足電圧継電器',ovr:'過電圧継電器',dgr:'方向地絡継電器',cable:'高圧ケーブル絶縁診断',taiatsu:'絶縁耐力試験'};
function projOK(x){return x&&typeof x==='object'&&Array.isArray(x.items)}
(function(){const n=state.projects.length;state.projects=state.projects.filter(projOK);if(state.projects.length!==n){save();render()}})();

/* ===== 自家用工作物 管理アプリとの連携(?kanri=事業場:点検) ===== */
(function(){const q=new URLSearchParams(location.search);const kn=q.get('kanri');if(!kn)return;const [sid,iid]=kn.split(':');
  let pid=q.get('pid');
  if(!pid||!state.projects.find(p=>p.id===pid)){
    if(!q.get('new'))return;
    const b=document.createElement('button');b.dataset.act='newProject';b.style.display='none';document.body.appendChild(b);b.click();b.remove();
    const np=state.projects[state.projects.length-1];np.name=q.get('name')||np.name;if(q.get('date'))np.date=q.get('date');save();pid=np.id;
    try{const K=JSON.parse(localStorage.getItem('kanri.v1')||'null');const s=K&&K.sites.find(x=>x.id===sid);const i=s&&s.insps.find(x=>x.id===iid);
      if(i){i.links=i.links||{};i.links[APPID]=pid;localStorage.setItem('kanri.v1',JSON.stringify(K))}}catch(e){}
    try{history.replaceState(null,'','?kanri='+encodeURIComponent(kn)+'&pid='+encodeURIComponent(pid))}catch(e){}
  }
  go({name:'project',pid});
  const st=document.createElement('style');st.textContent='.kanri-back{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:#16496b;color:#fff;text-decoration:none;padding:9px 16px;border-radius:999px;font-size:14px;font-family:sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.3)}@media print{.kanri-back{display:none!important}}';document.head.appendChild(st);
  const a=document.createElement('a');a.href='kanri.html#s='+encodeURIComponent(sid)+'&i='+encodeURIComponent(iid);a.className='kanri-back';a.textContent='← 管理アプリ';document.body.appendChild(a);
})();

(function(){const a=document.querySelector('.kanri-back');if(!a||document.querySelector('.kanri-top'))return;let nm='';
  try{const K=JSON.parse(localStorage.getItem('kanri.v1')||'null');const sid=decodeURIComponent((a.getAttribute('href').match(/s=([^&]+)/)||[])[1]||'');const s=K&&K.sites.find(x=>x.id===sid);nm=s?s.name:''}catch(e){}
  const d=document.createElement('div');d.className='kanri-top';d.innerHTML='<a></a><span></span>';d.querySelector('a').href=a.getAttribute('href');d.querySelector('a').textContent='← 管理アプリへ戻る';d.querySelector('span').textContent=nm;document.body.insertBefore(d,document.body.firstChild);
  const st=document.createElement('style');st.textContent='.kanri-top{display:flex;gap:12px;align-items:center;background:#fff3cd;border-bottom:1px solid #e0c97a;padding:8px 16px;font-size:14px;font-family:sans-serif;position:relative;z-index:40}.kanri-top a{color:#16496b;font-weight:700;text-decoration:none;border:1px solid #16496b;border-radius:6px;padding:5px 12px;background:#fff;white-space:nowrap}.kanri-top span{color:#5b6878;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media print{.kanri-top{display:none!important}}';document.head.appendChild(st)})();

</script>
