<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>過電流継電器試験成績表</title>
<meta name="apple-mobile-web-app-title" content="過電流試験">
<meta name="application-name" content="過電流試験">
<link rel="apple-touch-icon" href="icons/ocr-180.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icons/ocr-512.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 現場の試験器パネル風:紺のバー、白い入力面、良=緑/否=赤 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2430; --sub:#5b6878; --line:#cfd6de;
  --accent:#16496b; --accent-ink:#ffffff; --accent-soft:#e3edf5;
  --ok:#17803d; --ok-soft:#e3f4e8; --ng:#c62828; --ng-soft:#fde8e8;
  --meas:#1a3fbf;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.bar h1{font-size:16px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--accent-ink);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.wrap{max-width:860px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:14px;margin:0;color:var(--accent);letter-spacing:.05em}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>label{flex:1 1 140px;min-width:0}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 9px;background:#fff;font-size:16px;color:var(--ink)}
/* iPhone/iPadのSafariで日付欄がはみ出して隣と重なるのを防ぐ */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:2.5em;line-height:1.3}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.row>label>input,.row>label>select{min-width:0;max-width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.btn.small{padding:5px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--accent)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{font-size:12px;color:var(--sub)}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-ng{background:var(--ng-soft);color:var(--ng)}
.b-none{background:#edf0f3;color:var(--sub)}
.grp{font-size:13px;font-weight:700;color:var(--sub);display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.note{font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:24px 8px}
/* 測定値入力 */
.phase{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:10px}
.phase-h{display:flex;align-items:center;gap:10px}
.phase-h b{font-size:18px;color:var(--accent);width:28px}
.phase-h .jd{margin-left:auto;display:flex;align-items:center;gap:6px}
.phase-h select{width:auto;padding:4px 6px;font-size:14px}
.sub{font-size:12px;font-weight:700;color:var(--sub);border-bottom:1px dashed var(--line);padding-bottom:2px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f .lb{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:4px}
.f .lb em{font-style:normal;color:var(--ink);font-weight:500}
.f input{font-size:17px;padding:7px 8px;font-variant-numeric:tabular-nums;color:var(--meas)}
.f .rg{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;line-height:1.3;min-height:1.3em}
.f.ok input{border-color:var(--ok);background:var(--ok-soft)}
.f.ng input{border-color:var(--ng);background:var(--ng-soft)}
.f.ok .rg{color:var(--ok)} .f.ng .rg{color:var(--ng);font-weight:700}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:420px){.fgrid{gap:6px}.f input{font-size:16px;padding:6px}}
.mono{font-variant-numeric:tabular-nums}
.tolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1b2430;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;z-index:20}
/* 継電器入力画面(コンパクト・左右2列) */
.wrap.cmp{max-width:1400px;gap:8px;padding-top:8px;padding-bottom:12px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:760px){.two-col{grid-template-columns:minmax(0,1fr)}}
.cmp .card{padding:8px 10px;gap:6px}
.cmp .card h2{font-size:13px}
.cmp label{font-size:11px;gap:1px}
.cmp input[type=text],.cmp select{font-size:14px;padding:4px 6px;border-radius:4px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cmp .note{font-size:11px;line-height:1.35}
.cmp .phase{gap:4px}
.cmp .phase-h b{font-size:16px}
.cmp .phase-h select{font-size:13px;padding:2px 4px}
.cmp .sub{font-size:11px;padding-bottom:0}
.cmp .fgrid{gap:6px}
.cmp .f .lb{font-size:11px}
.cmp .f input{font-size:15px;padding:3px 6px}
.cmp .f .rg{font-size:10.5px}
.cmp .btns .btn{padding:6px 12px}
/* 印刷シート */
.pv-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pages{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
/* 細い罫線を出すため、2倍の大きさで作って半分に縮小する(ブラウザは1px未満の線を描けないため) */
.sheet{width:297mm;height:209mm;background:#fff;color:#000;padding:9mm 11mm;font-family:var(--font);box-shadow:0 1px 4px rgba(0,0,0,.15);flex:none;overflow:hidden}
.sheet-x{width:550mm;height:382mm;transform:scale(.5);transform-origin:0 0}
.sheet-in{border:4px solid #000;height:100%;padding:12mm 12mm 10mm;display:flex;flex-direction:column;gap:6mm}
.s-title{text-align:center;font-size:34pt;letter-spacing:.55em;font-weight:500;margin:2mm 0 4mm}
.s-top{display:flex;justify-content:space-between;align-items:flex-end}
.s-panel{border:2px solid #000;background:#d9f2d9;min-width:80mm;padding:2.4mm 12mm;text-align:center;font-size:21pt;letter-spacing:.2em}
.s-date{font-size:20pt}
table.s{width:100%;border-collapse:collapse;table-layout:fixed;font-size:18pt;border:3px solid #000}
table.s th,table.s td{border:1px solid #222;text-align:center;vertical-align:middle;padding:0 1mm;height:13.2mm;line-height:1.15;overflow:hidden;white-space:nowrap}
table.s th{background:#d4d4d4;font-weight:400}
table.s th.sm{font-size:16pt;letter-spacing:-.02em}
table.s td.cir{white-space:normal;font-size:17pt;line-height:1.25}
table.s td.v{color:#1a3fbf;font-size:19pt}
table.s td.c{font-size:17pt;border-top:1px dotted #777}
table.s tr.h1 th{border-top:3px solid #000}
table.s tr.h3 th,table.s th.rs3{border-bottom:2px solid #000}
table.s tr.ph2 td{border-top:2px solid #000}
table.s tr.m td.mt{border-bottom:none}
table.s td.kanri{text-align:left;font-size:16pt;line-height:1.3;padding:1.6mm 2.4mm;white-space:normal;vertical-align:top}
table.s td.big{font-size:20pt}
table.s td.setc{padding:0}
.svs{display:flex;height:100%;align-items:stretch}
.sv{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.2mm}
.sv+.sv{border-left:1px dotted #888}
.sv-v{font-size:20pt;min-height:1.2em;text-align:center}
.sv-l{font-size:13pt;color:#9a9a9a;letter-spacing:.05em;text-align:center}
table.s td.note20{font-size:16pt;color:#1a3fbf;border-top:none}
.s-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
table.cb{border-collapse:collapse;font-size:19pt;border:3px solid #000}
table.cb th{background:#d4d4d4;font-weight:400;border:1px solid #222;padding:2.4mm 8mm}
table.cb td{border:1px solid #222;width:44mm;text-align:center;color:#1a3fbf}
.s-cap{font-size:18pt;padding-right:8mm}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff}
  .noprint{display:none!important}
  .wrap{padding:0;max-width:none;gap:0}
  .pages{zoom:1!important;gap:0}
  .sheet{box-shadow:none;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* 用紙の向き:A4縦は横向きの成績表を70%に縮めて縦の用紙の上に置く */
.pg{display:contents}
.pp .pg{display:block;width:210mm;height:296mm;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);padding-top:10mm;overflow:hidden;flex:none}
.pp .pg .sheet{zoom:.7;box-shadow:none;margin:0}
.seg{display:inline-flex;border:1px solid var(--accent);border-radius:6px;overflow:hidden}
.seg button{border:none;background:#fff;color:var(--accent);padding:7px 14px;cursor:pointer;font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
@media print{.pp .pg{box-shadow:none;break-after:page;page-break-after:always}.pp .pg:last-child{break-after:auto;page-break-after:auto}.pp .sheet{break-after:auto!important;page-break-after:auto!important}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* ========== 基本データ ========== */
const LS_KEY='ocrTest.v1';
const DEF_SET={tolMin:10,tol200:17,tol300:17,tol700:12,instTime:0.15,tolInst:15,instLimit:20,round:'floor',showInstTol:false};
const POINTS=[200,300,700];
// 限時特性 (I=整定に対する倍数M, D=ダイヤル)  すべて ×D/10
const CHARS={
  VI:{label:'強反限時 VI',f:'13.5/(M−1)'},
  NI:{label:'反限時 NI',f:'0.14/(M^0.02−1)'},
  EI:{label:'超反限時 EI',f:'80/(M²−1)'},
  LI:{label:'長反限時 LI',f:'120/(M−1)'},
  DT:{label:'定限時 DT',f:'2秒'},
  DO:{label:'静止形 DO',f:'62.1875/(M−0.5)²+0.05'},
  NSNI:{label:'反限時(日新)',f:'3/(M−1)+1.7'},
  NSLI:{label:'長反限時(日新)',f:'150/(M−1)+3'},
  TABLE:{label:'手入力(ダイヤル10の値)',f:'ダイヤル10の値×D/10'}
};
const BUILTIN=[
  {id:'omron-k2oc-acn',maker:'オムロン',name:'K2OC-ACN',rating:'5A・50Hz',chars:['VI','NI','EI','DT','DO'],def:'VI',builtin:true},
  {id:'omron-k2oc-avn',maker:'オムロン',name:'K2OC-AVN',rating:'5A・50Hz',chars:['VI','NI','EI','DT','DO'],def:'VI',builtin:true},
  {id:'nissin-ns4r25',maker:'日新電機',name:'NS-4R25',rating:'5A・50Hz',chars:['NSNI','EI','NSLI'],def:'NSNI',builtin:true},
  {id:'nissin-ns4r35',maker:'日新電機',name:'NS-4R35',rating:'5A・50Hz',chars:['NSNI','EI','NSLI'],def:'NSNI',builtin:true},
  {id:'nissin-ns2c15',maker:'日新電機',name:'NS-2C15',rating:'5A・50Hz',chars:['NSNI','EI','NSLI'],def:'NSNI',builtin:true},
  {id:'mitsu-moc-a3v-r',maker:'三菱電機',name:'MOC-A3V-R',rating:'5A・50Hz',chars:['EI','VI','NI','DT'],def:'EI',builtin:true},
  {id:'mitsu-moc-a3t-r',maker:'三菱電機',name:'MOC-A3T-R',rating:'5A・50Hz',chars:['EI','VI','NI','DT'],def:'EI',builtin:true},
  {id:'fuji-qha-oc1',maker:'富士電機',name:'QHA-OC1',rating:'5A・50Hz',chars:['EI','VI','NI','DT'],def:'EI',builtin:true},
  {id:'fuji-qha-oc2',maker:'富士電機',name:'QHA-OC2',rating:'5A・50Hz',chars:['EI','VI','NI','DT'],def:'EI',builtin:true},
  {id:'taiwa-toc-da10',maker:'泰和電気工業',name:'TOC-DA10',rating:'5A・50Hz',chars:['EI','VI','NI','DT'],def:'EI',builtin:true},
  {id:'generic',maker:'',name:'標準特性(IEC式)',rating:'',chars:['NI','VI','EI','LI','DT'],def:'VI',builtin:true},
  {id:'manual',maker:'',name:'手入力(その他の型式)',rating:'',chars:['TABLE'],def:'TABLE',builtin:true}
];

/* ========== 状態 ========== */
let state=load();
let view={name:'home'};
let pendingConfirm=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function emptyPh(){return {min:'',a1:'',a2:'',ai:'',b1:'',b2:'',bi:'',inst:''}}
function newRelay(panel){
  return {id:uid(),panel:panel||'受電盤',circuit:'',modelId:'omron-k2oc-acn',model:'K2OC-ACN',maker:'オムロン',rating:'5A・50Hz',
    made:'',serial:'',charType:'VI',table:{},T:'5',D:'1',I:'',dialA:'10',dialB:'',p1:200,p2:300,
    ph:{R:emptyPh(),T:emptyPh()},jd:{R:'auto',T:'auto'},cb:''};
}
function sample(){
  const mk=(panel,circuit,serial,R,T)=>{const r=newRelay(panel);Object.assign(r,{circuit,serial,made:'2025年',I:'50',cb:'良'});
    const f=a=>({min:a[0],a1:'',a2:'',ai:'',b1:a[1],b2:a[2],bi:a[3],inst:a[4]});r.ph={R:f(R),T:f(T)};return r};
  return {id:uid(),name:'サンプル(2026年2月 年次点検)',date:'2026-02-11',weather:'晴',temp:'10',hum:'53',
    relays:[mk('受電盤','受電盤','',['5.00','1.36','0.68','0.056','20.2'],['5.00','1.35','0.67','0.052','20.1']),
      mk('高圧分岐盤','第１変電設備','',['5.00','1.37','0.68','0.050','19.0'],['5.00','1.36','0.67','0.056','19.0']),
      mk('高圧分岐盤','第２変電設備','',['4.95','1.26','0.49','0.053','19.3'],['4.95','1.26','0.46','0.053','19.4'])]};
}
function load(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){}
  if(!s){s={v:1,projects:[sample()],models:[],settings:{...DEF_SET}}}
  s.settings={...DEF_SET,...(s.settings||{})};
  s.models=s.models||[];s.projects=s.projects||[];
  return s;
}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){toast('保存できませんでした(ブラウザの保存領域)')}}

/* ========== 計算 ========== */
function num(v){
  if(v===undefined||v===null)return NaN;
  let s=String(v).replace(/[０-９．－]/g,c=>c==='．'?'.':c==='－'?'-':String.fromCharCode(c.charCodeAt(0)-0xFEE0)).trim();
  if(s==='')return NaN; const n=Number(s); return isFinite(n)?n:NaN;
}
function allModels(){return [...BUILTIN,...state.models]}
function getModel(id){return allModels().find(m=>m.id===id)}
function charAt(r,p,D){
  D=num(D); if(!(D>0))return NaN;
  const M=p/100,k=D/10;
  switch(r.charType){
    case 'VI':return 13.5/(M-1)*k;
    case 'NI':return 0.14/(Math.pow(M,0.02)-1)*k;
    case 'EI':return 80/(M*M-1)*k;
    case 'LI':return 120/(M-1)*k;
    case 'DT':return 2*k;
    case 'DO':return 62.1875/Math.pow(M-0.5,2)*k+0.05;
    case 'NSNI':return (3/(M-1)+1.7)*k;
    case 'NSLI':return (150/(M-1)+3)*k;
    case 'TABLE':{const v=num((r.table||{})[p]);return v*k}
  }
  return NaN;
}
function fmtChar(v){
  if(!isFinite(v))return '';
  if(state.settings.round==='floor')return (Math.floor(v*100+1e-7)/100).toFixed(2);
  return v.toFixed(2);
}
function dialB(r){return (r.dialB!==''&&r.dialB!=null)?r.dialB:r.D}
function tolFor(p){return num(state.settings['tol'+p])}
function instRef(r){
  const I=num(r.I),L=num(state.settings.instLimit);
  if(!(I>0))return {ref:NaN,limited:false};
  if(L>0&&I>L)return {ref:L,limited:true};
  return {ref:I,limited:false};
}
function band(ref,tol){if(!isFinite(ref)||!isFinite(tol))return null;return {lo:ref*(1-tol/100),hi:ref*(1+tol/100)}}
// 1相分の評価
function evalPhase(r,k){
  const d=r.ph[k]||emptyPh(),out={};
  const chk=(key,ref,tol,dec)=>{
    const b=band(ref,tol),x=num(d[key]);
    out[key]={ref,b,dec,ok:(b&&isFinite(x))?(x>=b.lo-1e-9&&x<=b.hi+1e-9):null,x};
  };
  chk('min',num(r.T),num(state.settings.tolMin),2);
  const cA1=charAt(r,r.p1,r.dialA),cA2=charAt(r,r.p2,r.dialA),cB1=charAt(r,r.p1,dialB(r)),cB2=charAt(r,r.p2,dialB(r));
  chk('a1',cA1,tolFor(r.p1),2);chk('a2',cA2,tolFor(r.p2),2);chk('b1',cB1,tolFor(r.p1),2);chk('b2',cB2,tolFor(r.p2),2);
  const it=num(state.settings.instTime);
  ['ai','bi'].forEach(key=>{const x=num(d[key]);out[key]={max:it,ok:(isFinite(x)&&isFinite(it))?x<=it+1e-9:null,x}});
  const ir=instRef(r);chk('inst',ir.ref,num(state.settings.tolInst),1);out.inst.limited=ir.limited;
  return out;
}
function judgeOf(r,k){
  const m=(r.jd||{})[k]||'auto';
  if(m!=='auto')return m;
  const e=evalPhase(r,k);let any=false,bad=false;
  Object.values(e).forEach(v=>{if(v.ok===true)any=true;if(v.ok===false)bad=true});
  return bad?'否':(any?'良':'');
}
function relayJudge(r){const a=judgeOf(r,'R'),b=judgeOf(r,'T');if(a==='否'||b==='否')return '否';if(a==='良'||b==='良')return '良';return ''}
function badge(j){return j==='良'?'<span class="badge b-ok">良</span>':j==='否'?'<span class="badge b-ng">否</span>':'<span class="badge b-none">未</span>'}

/* ========== 共通 ========== */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.createElement('div');t.className='toast noprint';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function proj(){return state.projects.find(p=>p.id===view.pid)}
function relay(){const p=proj();return p&&p.relays.find(r=>r.id===view.rid)}
function go(v){view=v;pendingConfirm=null;render();window.scrollTo(0,0)}
function fmtDate(d){if(!d)return '';const m=d.match(/(\d+)-(\d+)-(\d+)/);return m?`${+m[1]}年${+m[2]}月${+m[3]}日`:d}
function panels(p){const out=[];p.relays.forEach(r=>{if(!out.includes(r.panel))out.push(r.panel)});return out}

/* ========== 画面描画 ========== */
function render(){
  const app=$('#app');
  const v=view.name;
  if(v==='home')app.innerHTML=homeHTML();
  else if(v==='project')app.innerHTML=projectHTML();
  else if(v==='relay')app.innerHTML=relayHTML();
  else if(v==='preview')app.innerHTML=previewHTML();
  else if(v==='models')app.innerHTML=modelsHTML();
  else if(v==='settings')app.innerHTML=settingsHTML();
  if(v==='relay')updateInd();
  if(v==='preview'){setPortrait(getOrient()==='P');fitPages()}
}
function barHTML(title,back){
  return `<div class="bar noprint">${back?`<button data-act="${back}">← 戻る</button>`:''}<h1>${esc(title)}</h1></div>`;
}

function phaseHTML(r,k){
  const d=r.ph[k];
  const f=(key,label)=>`<div class="f" id="f-${k}-${key}"><div class="lb"><span>${label}</span><em id="c-${k}-${key}"></em></div>
    <input type="text" inputmode="decimal" data-ph="${k}.${key}" value="${esc(d[key])}" aria-label="${k}相 ${label}"><div class="rg" id="g-${k}-${key}"></div></div>`;
  const j=(r.jd||{})[k]||'auto';
  return `<div class="card phase">
    <div class="phase-h"><b>${k}</b><span class="note">相</span>
      <span class="jd"><span class="note">判定</span><span id="jd-${k}"></span><select data-jd="${k}" aria-label="${k}相の判定">
        <option value="auto" ${j==='auto'?'selected':''}>自動判定</option><option ${j==='良'?'selected':''}>良</option><option ${j==='否'?'selected':''}>否</option></select></span></div>
    <div class="fgrid">${f('min','最小動作電流(A)')}${f('inst','瞬時動作電流(A)')}</div>
    <div class="sub">ダイヤル ${esc(r.dialA)} の動作時間(S)</div>
    <div class="fgrid">${f('a1',r.p1+'%')}${f('a2',r.p2+'%')}${f('ai','瞬時')}</div>
    <div class="sub">ダイヤル ${esc(dialB(r))} の動作時間(S)</div>
    <div class="fgrid">${f('b1',r.p1+'%')}${f('b2',r.p2+'%')}${f('bi','瞬時')}</div>
  </div>`;
}
function updateInd(){
  const r=relay();if(!r)return;
  ['R','T'].forEach(k=>{
    const e=evalPhase(r,k);
    Object.keys(e).forEach(key=>{
      const it=e[key],box=document.getElementById(`f-${k}-${key}`);if(!box)return;
      box.classList.toggle('ok',it.ok===true);box.classList.toggle('ng',it.ok===false);
      const c=document.getElementById(`c-${k}-${key}`),g=document.getElementById(`g-${k}-${key}`);
      let ctext='',gtext='';
      if(key==='ai'||key==='bi'){gtext=isFinite(it.max)?`${it.max}秒以内`:''}
      else if(key==='min'){gtext=it.b?`整定${it.ref}A → ${it.b.lo.toFixed(2)}〜${it.b.hi.toFixed(2)}`:'T未入力'}
      else if(key==='inst'){gtext=it.b?`${it.limited?it.ref+'Aで試験':'整定'+it.ref+'A'} → ${it.b.lo.toFixed(1)}〜${it.b.hi.toFixed(1)}`:'I未入力'}
      else {ctext=isFinite(it.ref)?`(${fmtChar(it.ref)})`:'';gtext=it.b?`${it.b.lo.toFixed(2)}〜${it.b.hi.toFixed(2)}`:'特性値なし'}
      if(it.ok===false)gtext='範囲外 '+gtext;
      c.textContent=ctext;g.textContent=gtext;
    });
    const jb=document.getElementById('jd-'+k);if(jb)jb.innerHTML=badge(judgeOf(r,k));
  });
  const n=document.getElementById('instNote');
  if(n){const ir=instRef(r);n.textContent=ir.limited?`瞬時の整定 ${r.I}A が ${state.settings.instLimit}A を超えるため、${ir.ref}Aで試験として判定します(用紙に「(${ir.ref}Aで試験)」と記載)。`:''}
}

/* --- 印刷プレビュー --- */
function previewHTML(){
  const mode=view.mode; // full / form / blank
  let pages;
  if(mode==='blank'){pages=[sheetHTML(null,'',[null,null],'blank')]}
  else{
    const p=proj();
    const ps=view.panel?[view.panel]:panels(p);
    pages=[];
    ps.forEach(pn=>{const rs=p.relays.filter(r=>r.panel===pn);for(let i=0;i<rs.length;i+=2)pages.push(sheetHTML(p,pn,[rs[i],rs[i+1]||null],mode))});
  }
  const back=mode==='blank'?'toHome':'toProject';
  return `${barHTML(mode==='blank'?'白紙の記入用紙':mode==='form'?'記入用紙':'成績表',back)}
  <div class="wrap" style="max-width:none">
    <div class="pv-bar noprint">
      <span class="seg" role="group" aria-label="用紙の向き"><button data-act="orientL" class="${getOrient()==='L'?'on':''}">A4横</button><button data-act="orientP" class="${getOrient()==='P'?'on':''}">A4縦</button></span><button class="btn main" data-act="doPrint">印刷する</button>
      ${mode!=='blank'?`<button class="btn" data-act="${mode==='full'?'previewForm':'previewFull'}">${mode==='full'?'記入用紙に切替':'測定値入りに切替'}</button>`:''}
      <span class="note">${pages.length}枚。印刷画面で「用紙:A4」「${getOrient()==='P'?'縦':'横'}」「余白なし」(または既定)を選んでください。PDF保存も印刷画面から。</span>
    </div>
    <div class="pages" id="pages">${pages.map(x=>`<div class="pg">${x}</div>`).join('')}</div>
  </div>`;
}
function fitPages(){
  const el=$('#pages');if(!el)return;
  const w=el.parentElement.clientWidth-2;const pw=(getOrient()==='P'?210:297)*96/25.4;
  el.style.zoom=Math.min(1,w/pw);
}
function manageLines(r){
  const s=state.settings,pts=[...new Set(r?[r.p1,r.p2,700]:[200,300,700])].sort((a,b)=>a-b);
  const L=['( 最小動作電流 )',`整定タップ ±${s.tolMin}％以内`,'( 動 作 時 間 )'];
  pts.forEach(p=>L.push(`${p}％時 ±${s['tol'+p]}％以内`));
  L.push(`瞬 時 ${s.instTime}(S)以内`);
  if(s.showInstTol){L.push('( 瞬時動作電流 )',`整定値 ±${s.tolInst}％以内`)}
  return L.map(esc).join('<br>');
}

      return mode==='form'?`　　　年　　月　　日 ・ 天候　　 ・ 温度　　℃ ・ 湿度　　％`:`${ds} ・ 天候 ${v(p.weather)} ・ 温度 ${v(p.temp)}℃ ・ 湿度 ${v(p.hum)}％`})()
    :'　　　年　　月　　日 ・ 天候　　 ・ 温度　　℃ ・ 湿度　　％';
  const cbs=rs.filter(Boolean).map(r=>r.cb).filter(Boolean);
  const cb=mode==='full'?(cbs.includes('否')?'否':cbs.length?'良':''):'';
  return `<div class="sheet"><div class="sheet-x"><div class="sheet-in">
    <div class="s-title">過電流継電器試験成績表</div>
    <div class="s-top"><div class="s-panel">${esc(panel)||'　'}</div><div class="s-date">${dateLine}</div></div>
    ${blockHTML(rs[0],mode)}
    ${blockHTML(rs[1],mode)}
    <div class="s-foot"><table class="cb"><tr><th>遮断器 連動試験</th><td>${esc(cb)}</td></tr></table><div class="s-cap">動作時間の（　　）内は限時特性曲線値とする</div></div>
  </div></div></div>`;
}
function blockHTML(r,mode){
  const has=!!r,full=mode==='full'&&has;
  const cols=[38,22,40,36,36,36,36,36,36,46,26,0];
  const cg='<colgroup>'+cols.map(w=>w?`<col style="width:${w}mm">`:'<col>').join('')+'</colgroup>';
  const sp=(k,v,lb)=>`<div class="sv"><div class="sv-v">${k} = ${v}</div><div class="sv-l">${lb}</div></div>`;
  const setv=`<div class="svs">${sp('T',has?esc(r.T):'','限時電流 (A)')}${sp('D',has?esc(r.D):'','動作時間 (s)')}${sp('I',has?esc(r.I||'ロック'):'','瞬時電流 (A)')}</div>`;
  const head=`<tr><th colspan="2">型　　式</th><th colspan="2">製 造 者 名</th><th colspan="2">定　　格</th><th colspan="2">製 造 年 月</th><th colspan="2">製 造 番 号</th><th colspan="2">整　定　値</th></tr>
    <tr><td colspan="2" class="big" style="height:20mm">${has?esc(r.model):''}</td><td colspan="2" class="big">${has?esc(r.maker):''}</td><td colspan="2" class="big">${has?esc(r.rating):''}</td>
    <td colspan="2" class="big">${has?esc(r.made):''}</td><td colspan="2" class="big">${has?esc(r.serial):''}</td><td colspan="2" class="big setc">${setv}</td></tr>`;
  const p1=has?r.p1:200,p2=has?r.p2:300;
  const th=`<tr class="h1"><th rowspan="3" class="rs3">回 路 名</th><th rowspan="3" class="rs3">相 別</th><th rowspan="2" class="sm">最小動作電流</th><th colspan="6">動　作　時　間　　(S)</th><th rowspan="2" class="sm">瞬時動作電流</th><th rowspan="3" class="rs3">判 定</th><th rowspan="3" class="rs3">管　理　値</th></tr>
    <tr><th colspan="3">ダイヤル　${has?esc(r.dialA):'10'}</th><th colspan="3">ダイヤル　${has?esc(dialB(r)):''}</th></tr>
    <tr class="h3"><th>(A)</th><th>${p1} ％</th><th>${p2} ％</th><th>瞬 時</th><th>${p1} ％</th><th>${p2} ％</th><th>瞬 時</th><th>(A)</th></tr>`;
  let body='';
  ['R','T'].forEach((k,i)=>{
    const d=has?r.ph[k]:emptyPh();
    const mv=key=>{if(!full)return '';const v=d[key];if(v==='')return '';const n=num(v);
      if(key==='min'&&isFinite(n))return n.toFixed(2);if(key==='inst'&&isFinite(n))return n.toFixed(1);return esc(v)};
    const c=(pt,dial)=>has?(()=>{const v=charAt(r,pt,dial);return isFinite(v)?`( ${fmtChar(v)} )`:''})():'';
    const ir=has?instRef(r):{limited:false};
    const j=full?judgeOf(r,k):'';
    body+=`<tr class="m${i?" ph2":""}">${i===0?`<td rowspan="4" class="cir">${has?esc(r.circuit):''}</td>`:''}<td rowspan="2" class="big">${k==='R'?'Ｒ':'Ｔ'}</td>
      <td rowspan="2" class="v">${mv('min')}</td><td class="v mt">${mv('a1')}</td><td class="v mt">${mv('a2')}</td><td class="v mt">${mv('ai')}</td>
      <td class="v mt">${mv('b1')}</td><td class="v mt">${mv('b2')}</td><td class="v mt">${mv('bi')}</td><td class="v mt">${mv('inst')}</td>
      <td rowspan="2" class="v big" style="${j==='否'?'color:#c62828;font-weight:700':''}">${esc(j)}</td>
      ${i===0?`<td rowspan="4" class="kanri">${manageLines(r)}</td>`:''}</tr>
      <tr><td class="c">${c(p1,r&&r.dialA)}</td><td class="c">${c(p2,r&&r.dialA)}</td><td class="c"></td>
      <td class="c">${c(p1,r&&dialB(r))}</td><td class="c">${c(p2,r&&dialB(r))}</td><td class="c"></td>
      <td class="c note20">${ir.limited?`（${ir.ref}Aで試験）`:''}</td></tr>`;
  });
  return `<table class="s">${cg}${head}${th}${body}</table>`;
}

/* ========== イベント ========== */
// 用紙の向き(A4縦のときは横向きの用紙を縮小して上に置く)
const ORK='tools.printOrient';
function getOrient(){try{const v=localStorage.getItem(ORK);if(v)return v==='P'?'P':'L'}catch(e){}return window.__orient||'L'}
function setOrient(o){try{localStorage.setItem(ORK,o)}catch(e){}window.__orient=o}
function setPortrait(on){document.documentElement.classList.toggle('pp',on);let st=document.getElementById('ppst');
  if(on&&!st){st=document.createElement('style');st.id='ppst';st.textContent='@page{size:A4 portrait;margin:0}';document.head.appendChild(st)}
  if(!on&&st)st.remove()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,p=proj();
  switch(a){
    case 'toHome':go({name:'home'});break;
    case 'toProject':go({name:'project',pid:view.pid});break;
    case 'newProject':{const np={id:uid(),name:'新しい件名',date:new Date().toISOString().slice(0,10),weather:'',temp:'',hum:'',relays:[]};
      state.projects.push(np);save();go({name:'project',pid:np.id});setTimeout(()=>{const i=$('#pName');if(i){i.focus();i.select()}},50);break}
    case 'openProject':go({name:'project',pid:b.dataset.id});break;
    case 'openRelay':go({name:'relay',pid:view.pid,rid:b.dataset.id});break;
    case 'addRelay':{const last=p.relays[p.relays.length-1];const r=newRelay(last?last.panel:'受電盤');
      if(last){['modelId','model','maker','rating','charType','T','D','I','dialA','dialB','p1','p2','made'].forEach(k=>r[k]=last[k]);r.table={...(last.table||{})}}
      p.relays.push(r);save();go({name:'relay',pid:p.id,rid:r.id});break}
    case 'dupRelay':{const cur=relay();const r=JSON.parse(JSON.stringify(cur));r.id=uid();r.circuit='';r.serial='';r.ph={R:emptyPh(),T:emptyPh()};r.jd={R:'auto',T:'auto'};r.cb='';
      const idx=p.relays.indexOf(cur);p.relays.splice(idx+1,0,r);save();go({name:'relay',pid:p.id,rid:r.id});toast('次の継電器を追加しました');break}
    case 'delRelay':if(pendingConfirm!=='delRelay'){pendingConfirm='delRelay';render();break}
      p.relays=p.relays.filter(r=>r.id!==view.rid);save();go({name:'project',pid:p.id});toast('削除しました');break;
    case 'delProject':if(pendingConfirm!=='delProject'){pendingConfirm='delProject';render();break}
      state.projects=state.projects.filter(x=>x.id!==p.id);save();go({name:'home'});toast('削除しました');break;
    case 'dupProject':{const np=JSON.parse(JSON.stringify(p));np.id=uid();np.name=p.name+'(次回)';np.date='';np.weather='';np.temp='';np.hum='';
      np.relays.forEach(r=>{r.id=uid();r.ph={R:emptyPh(),T:emptyPh()};r.jd={R:'auto',T:'auto'};r.cb=''});
      state.projects.push(np);save();go({name:'project',pid:np.id});toast('複製しました');break}
    case 'previewFull':go({name:'preview',pid:view.pid,mode:'full'});break;
    case 'previewForm':go({name:'preview',pid:view.pid,mode:'form'});break;
    case 'previewPanel':go({name:'preview',pid:view.pid,mode:'full',panel:b.dataset.panel});break;
    case 'blankPrint':go({name:'preview',mode:'blank'});break;
    case 'orientL':case 'orientP':setOrient(a==='orientP'?'P':'L');render();break;
    case 'doPrint':{setPortrait(getOrient()==='P');const el=$('#pages'),z=el.style.zoom;el.style.zoom=1;window.print();el.style.zoom=z;break}
    case 'openModels':go({name:'models'});break;
    case 'openSettings':go({name:'settings'});break;
    case 'resetSettings':state.settings={...DEF_SET};save();render();toast('初期値に戻しました');break;
    case 'addModel':{const name=$('#nmName').value.trim();if(!name){toast('型式を入れてください');break}
      const ch=$('#nmChar').value,table={};POINTS.forEach(pt=>{const v=$('#nmT'+pt).value.trim();if(v)table[pt]=v});
      if(ch==='TABLE'&&!Object.keys(table).length){toast('ダイヤル10の値を入れてください');break}
      state.models.push({id:'u'+uid(),maker:$('#nmMaker').value.trim(),name,rating:$('#nmRating').value.trim(),chars:[ch],def:ch,table});
      save();render();toast('登録しました');break}
    case 'delModel':{const k='delModel:'+b.dataset.id;if(pendingConfirm!==k){pendingConfirm=k;render();break}
      state.models=state.models.filter(m=>m.id!==b.dataset.id);save();pendingConfirm=null;render();break}
    case 'exportJson':{const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
      const a2=document.createElement('a');const d=new Date();
      a2.href=URL.createObjectURL(blob);a2.download=`継電器試験_バックアップ_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
      document.body.appendChild(a2);a2.click();setTimeout(()=>{URL.revokeObjectURL(a2.href);a2.remove()},500);break}
    case 'importJson':$('#importFile').click();break;
  }
});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.projects))throw 0;
      let n=0;d.projects.forEach(p=>{const i=state.projects.findIndex(x=>x.id===p.id);if(i>=0)state.projects[i]=p;else state.projects.push(p);n++});
      (d.models||[]).forEach(m=>{if(!state.models.find(x=>x.id===m.id))state.models.push(m)});
      if(d.settings)state.settings={...DEF_SET,...d.settings};
      save();render();toast(`${n}件の件名を読み込みました`)}catch(err){toast('バックアップファイルではないようです')}
    e.target.value=''};
  rd.readAsText(f);
});
document.addEventListener('input',e=>{
  const t=e.target,p=proj(),r=relay();
  if(t.id==='q'){view.q=t.value;if(!e.isComposing){const l=$('#plist');if(l)l.innerHTML=homeListHTML()}return}
  if(t.dataset.p&&p){p[t.dataset.p]=t.value;save();if(t.dataset.p==='name')$('.bar h1').textContent=t.value;return}
  if(t.dataset.r&&r){r[t.dataset.r]=t.value;save();updateInd();
    if(t.dataset.r==='circuit')$('.bar h1').textContent=(t.value||'継電器')+' の試験';
    if(t.dataset.r==='dialA'||t.dataset.r==='dialB'||t.dataset.r==='D'){document.querySelectorAll('.phase').forEach((el,i)=>{const s=el.querySelectorAll('.sub');s[0].textContent=`ダイヤル ${r.dialA} の動作時間(S)`;s[1].textContent=`ダイヤル ${dialB(r)} の動作時間(S)`})}
    return}
  if(t.dataset.ph&&r){const [k,key]=t.dataset.ph.split('.');r.ph[k][key]=t.value;save();updateInd();return}
  if(t.dataset.tb&&r){r.table=r.table||{};r.table[t.dataset.tb]=t.value;save();updateInd();return}
  if(t.dataset.s){state.settings[t.dataset.s]=t.value;save();return}
});
document.addEventListener('compositionend',e=>{if(e.target.id==='q'){view.q=e.target.value;const l=$('#plist');if(l)l.innerHTML=homeListHTML()}});
document.addEventListener('change',e=>{
  const t=e.target,r=relay();
  if(t.dataset.rs&&r){
    const k=t.dataset.rs,v=t.value;
    if(k==='modelId'){const m=getModel(v);r.modelId=v;if(m){if(!m.id.startsWith('generic')&&m.id!=='manual'){r.model=m.name;r.maker=m.maker}if(m.rating)r.rating=m.rating;r.charType=m.def;if(m.table)r.table={...m.table}}}
    else if(k==='p1'||k==='p2')r[k]=+v;
    else r[k]=v;
    save();render();return}
  if(t.dataset.jd&&r){r.jd=r.jd||{};r.jd[t.dataset.jd]=t.value;save();updateInd();return}
  if(t.dataset.ss){state.settings[t.dataset.ss]=t.dataset.ss==='showInstTol'?!!t.value:t.value;save();return}
});
window.addEventListener('resize',()=>{if(view.name==='preview')fitPages()});
window.addEventListener('beforeprint',()=>{const el=$('#pages');if(el)el.style.zoom=1});
window.addEventListener('afterprint',()=>{if(view.name==='preview')fitPages()});
render();
</script>
</body>
</html>
